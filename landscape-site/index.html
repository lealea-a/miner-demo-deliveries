    <script>
      (() => {
        const root = document.documentElement;
        const logicalWidth = 390;
        const logicalHeight = 844;

        const applyBootFrame = () => {
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          const scale = Math.min(
            viewportWidth / logicalWidth,
            viewportHeight / logicalHeight,
          );
          const left = Math.floor(
            (viewportWidth - logicalWidth * scale) / 2,
          );
          const top = Math.floor(
            (viewportHeight - logicalHeight * scale) / 2,
          );

          root.style.setProperty('--field-entry-boot-scale', String(scale));
          root.style.setProperty('--field-entry-boot-left', `${left}px`);
          root.style.setProperty('--field-entry-boot-top', `${top}px`);
        };

        const stopBootFrame = () => {
          window.removeEventListener('resize', applyBootFrame);
          window.visualViewport?.removeEventListener('resize', applyBootFrame);
          observer.disconnect();
        };

        const observer = new MutationObserver(() => {
          if (root.dataset.fieldEntryCoverStatus === 'ready') {
            stopBootFrame();
          }
        });

        applyBootFrame();
        window.addEventListener('resize', applyBootFrame, { passive: true });
        window.visualViewport?.addEventListener(
          'resize',
          applyBootFrame,
          { passive: true },
        );
        observer.observe(root, {
          attributes: true,
          attributeFilter: ['data-field-entry-cover-status'],
        });
      })();
    </script>
